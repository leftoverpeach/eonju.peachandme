<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); color: #1e293b; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 580px; background-color: #fff; border-radius: 24px; box-shadow: 0 20px 30px -10px rgba(0,0,0,.07), 0 10px 15px -5px rgba(0,0,0,.04); padding: 36px 28px; text-align: center; position: relative; overflow: hidden; }

        .map-hint { color: #64748b; font-size: .85rem; margin-bottom: 16px; }

        .btn-primary { background-color: #4f46e5; color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,.35); }
        .btn-primary:hover { background-color: #4338ca; transform: translateY(-2px); }
        .btn-secondary { background-color: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background-color: #e2e8f0; color: #0f172a; }
        .btn-vegetarian { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .btn-vegetarian:hover { background-color: #d1fae5; border-color: #34d399; }
        .btn-vegetarian.active-mode { background-color: #10b981; color: #fff; border-color: #059669; box-shadow: 0 4px 12px rgba(16,185,129,.3); }
        .btn-outline { background-color: transparent; color: #4f46e5; border: 1.5px solid #6366f1; }
        .btn-outline:hover { background-color: #eef2ff; }
        .btn-meal { background-color: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all .2s ease; }
        .btn-meal:hover { border-color: #6366f1; background-color: #f8fafc; transform: translateY(-3px); box-shadow: 0 8px 16px rgba(99,102,241,.12); }
        .btn-meal .emoji { font-size: 2rem; }
        .btn-meal .title { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
        .btn-meal .desc { font-size: .75rem; color: #64748b; }

        .screen { display: none; opacity: 0; transform: translateY(8px); transition: opacity .3s ease, transform .3s ease; }
        .screen.active { display: block; opacity: 1; transform: translateY(0); }

        .allergy-box { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; margin-bottom: 20px; text-align: left; }
        .allergy-title { font-size: .9rem; font-weight: 700; color: #334155; margin-bottom: 12px; display: block; }
        .allergy-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { padding: 8px 14px; border-radius: 20px; background-color: #fff; border: 1px solid #cbd5e1; font-size: .85rem; font-weight: 500; color: #475569; cursor: pointer; user-select: none; transition: all .2s ease; }
        .tag.selected { background-color: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 2px 8px rgba(239,68,68,.25); }

        .badge-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .badge-info { display: inline-block; background-color: #fee2e2; color: #dc2626; font-size: .8rem; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        .badge-veg { display: inline-block; background-color: #d1fae5; color: #047857; font-size: .8rem; padding: 5px 12px; border-radius: 20px; font-weight: 600; }

        .card-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .card { background-color: #fff; border: 1px solid #e2e8f0; border-radius: 18px; display: flex; flex-direction: column; box-shadow: 0 4px 12px rgba(0,0,0,.03); text-align: left; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.06); }
        .card.open { border-color: #6366f1; box-shadow: 0 8px 24px rgba(99,102,241,.15); }
        .card-main { padding: 18px; display: flex; align-items: center; gap: 16px; cursor: pointer; }
        .card-emoji { font-size: 2.5rem; background-color: #f8fafc; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; border-radius: 14px; flex-shrink: 0; }
        .card-info { flex-grow: 1; }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; }

        .card-desc { font-size: .88rem; color: #64748b; line-height: 1.4; }
        .card-action { margin-top: 8px; font-size: .78rem; font-weight: 600; color: #4f46e5; }

        /* 지도 영역 */
        .card-map-area { display: none; padding: 0 18px 18px; }

        .map-status { font-size: .85rem; color: #64748b; background-color: #f8fafc; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; line-height: 1.45; }
        .map-status.error { background-color: #fef2f2; color: #b91c1c; }
        .map-canvas { width: 100%; height: 260px; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; background-color: #e2e8f0; z-index: 0; }
        .place-list { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .place-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
        .place-item:hover { background-color: #eef2ff; border-color: #c7d2fe; }
        .place-name { font-size: .9rem; font-weight: 700; color: #0f172a; }
        .place-sub { font-size: .75rem; color: #64748b; margin-top: 2px; }
        .place-dist { font-size: .75rem; font-weight: 700; color: #4f46e5; white-space: nowrap; }
        .naver-btn { display: block; margin-top: 12px; padding: 12px; text-align: center; background-color: #03c75a; color: #fff; font-size: .9rem; font-weight: 700; border-radius: 10px; text-decoration: none; }
        .naver-btn:hover { background-color: #02b350; }
        .map-credit { margin-top: 6px; font-size: .7rem; color: #94a3b8; text-align: center; }
        .popup a { color: #03a94d; font-weight: 700; text-decoration: none; }

        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 44px; height: 44px; animation: spin .8s linear infinite; margin: 36px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. 메인 -->
        <div id="home-screen" class="screen active">
            <h1>🤖 AI가 추천해주는<br><span class="highlight">식단 메뉴</span></h1>
            <p class="subtitle">오늘 무엇을 먹을지 고민되시나요?<br>AI가 맞춤형 메뉴를 추천해드립니다!</p>

            <div id="allergy-section" class="allergy-box" style="display: none;">
                <span class="allergy-title">⚠️ 제외할 알레르기 성분을 선택하세요:</span>
                <div class="allergy-tags" id="allergy-tags-container"></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="goToMealSelection()">✨ 식단 추천받기</button>
                <button class="btn btn-secondary" onclick="toggleAllergySection()">🛡️ 알레르기가 있는 경우</button>
                <button id="veg-toggle-btn" class="btn btn-vegetarian" onclick="toggleVegetarian()">🥗 채식주의자인 경우</button>
            </div>
        </div>

        <!-- 2. 식사 시간 선택 -->
        <div id="meal-time-screen" class="screen">
            <h1>⏰ 식사 시간 선택</h1>
            <p class="subtitle">추천받고자 하는 식사 시간을 선택해 주세요.</p>

            <div class="meal-btn-grid">
                <div class="btn-meal" onclick="selectMealTime('breakfast')">
                    <span class="emoji">🌅</span><span class="title">아침</span><span class="desc">가볍고 프레시한</span>
                </div>
                <div class="btn-meal" onclick="selectMealTime('lunch')">
                    <span class="emoji">☀️</span><span class="title">점심</span><span class="desc">든든하고 균형잡힌</span>
                </div>
                <div class="btn-meal" onclick="selectMealTime('dinner')">
                    <span class="emoji">🌙</span><span class="title">저녁</span><span class="desc">푸짐하고 맛있는</span>
                </div>
            </div>

            <button class="btn btn-outline" onclick="goHome()">🏠 홈으로</button>
        </div>

        <!-- 3. 추천 결과 -->
        <div id="result-screen" class="screen">
            <h1 id="result-title">🍴 추천 메뉴</h1>
            <div id="badge-container" class="badge-list"></div>
            <p class="map-hint">💡 메뉴를 누르면 강남구청 주변 식당이 지도로 나와요</p>

            <div id="loading" class="loading-spinner"></div>
            <div id="recommendation-list" class="card-list" style="display: none;"></div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="getRecommendation()">🔄 다시 선택하기</button>
                <button class="btn btn-secondary" onclick="goToMealSelection()">⏰ 식사 시간 변경</button>
                <button class="btn btn-outline" onclick="goHome()">🏠 홈으로</button>
            </div>
        </div>

    </div>

            106: { keyword: "샐러드",       names: "샐러드|샐러디|salad",           cuisine: "salad" },
            107: { keyword: "요거트",       names: "요거트|요구르트|요아정|아이스크림", cuisine: "ice_cream|frozen_yogurt" },
            108: { keyword: "수프",         names: "수프|스프|브런치|soup",         cuisine: "soup" },
            201: { keyword: "제육볶음",     names: "제육|백반|밥상|한식",           cuisine: "korean" },
            202: { keyword: "돈가스",       names: "돈가스|돈까스|카츠|가츠",       cuisine: "tonkatsu" },
            203: { keyword: "순두부찌개",   names: "순두부|두부",                   cuisine: "" },
            204: { keyword: "산채비빔밥",   names: "비빔밥|산채|나물",              cuisine: "" },
            205: { keyword: "쌀국수",       names: "쌀국수|pho|Pho",                cuisine: "vietnamese" },
            206: { keyword: "연어덮밥",     names: "연어|사케|덮밥|스시|초밥",      cuisine: "sushi|japanese" },
            207: { keyword: "파스타",       names: "파스타|스파게티|이탈리|피자",   cuisine: "italian|pasta" },
            208: { keyword: "칼국수",       names: "칼국수",                        cuisine: "" },
            209: { keyword: "두부요리",     names: "두부|스테이크|채식",            cuisine: "vegetarian|vegan" },
            301: { keyword: "삼겹살",       names: "삼겹|고기|구이|갈비",           cuisine: "korean_bbq|barbecue" },
            302: { keyword: "치킨",         names: "치킨|닭|BBQ|bbq|교촌|bhc",      cuisine: "chicken" },
            303: { keyword: "초밥",         names: "초밥|스시|회|사시미|sushi",     cuisine: "sushi" },
            304: { keyword: "곱창",         names: "곱창|막창|대창",                cuisine: "" },
            305: { keyword: "리조또",       names: "리조또|이탈리|파스타",          cuisine: "italian" },
            306: { keyword: "마라탕",       names: "마라|꿔바로우|훠궈",            cuisine: "" },
            307: { keyword: "피자",         names: "피자|pizza|Pizza",              cuisine: "pizza" },
            308: { keyword: "팟타이",       names: "팟타이|타이|태국|Thai",         cuisine: "thai" },
            309: { keyword: "파스타",       names: "파스타|스파게티|이탈리",        cuisine: "italian|pasta" }
        };

        const OVERPASS_ENDPOINTS = [
            "https://overpass-api.de/api/interpreter",
            "https://overpass.kumi.systems/api/interpreter"
        ];

        /* ===================== 상태 ===================== */
        let selectedAllergens = new Set();
        let isVegetarianMode = false;
        let selectedMealTime = 'lunch';
        let currentMenuIds = new Set();
        let openedCard = null;
        let currentLeafletMap = null;

        window.onload = function () { renderAllergyTags(); };

        /* ===================== 기존 기능 ===================== */
        function renderAllergyTags() {
            const container = document.getElementById('allergy-tags-container');
            container.innerHTML = '';
            ALLERGEN_OPTIONS.forEach(allergen => {
                const tag = document.createElement('div');
                tag.className = 'tag' + (selectedAllergens.has(allergen) ? ' selected' : '');
                tag.innerText = allergen;
                tag.onclick = () => toggleAllergen(allergen, tag);
                container.appendChild(tag);
            });
        }

        function toggleAllergen(allergen, element) {
            if (selectedAllergens.has(allergen)) { selectedAllergens.delete(allergen); element.classList.remove('selected'); }
            else { selectedAllergens.add(allergen); element.classList.add('selected'); }
        }

        function toggleVegetarian() {
            isVegetarianMode = !isVegetarianMode;
            const vegBtn = document.getElementById('veg-toggle-btn');
            if (isVegetarianMode) {
                vegBtn.classList.add('active-mode');
                vegBtn.innerHTML = '🥗 채식주의자 모드 적용 중 (클릭 시 해제)';
            } else {
                vegBtn.classList.remove('active-mode');
                vegBtn.innerHTML = '🥗 채식주의자인 경우';
            }
        }

        function toggleAllergySection() {
            const section = document.getElementById('allergy-section');
            section.style.display = (section.style.display === 'none' || section.style.display === '') ? 'block' : 'none';
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        function goHome() { showScreen('home-screen'); }
        function goToMealSelection() { showScreen('meal-time-screen'); }

        function selectMealTime(time) {
            selectedMealTime = time;
            currentMenuIds.clear();

            const titleMap = { breakfast: '🌅 아침 추천 메뉴', lunch: '☀️ 점심 추천 메뉴', dinner: '🌙 저녁 추천 메뉴' };
            document.getElementById('result-title').innerText = titleMap[time];
            showScreen('result-screen');

            const badgeContainer = document.getElementById('badge-container');
            badgeContainer.innerHTML = '';
            if (isVegetarianMode) badgeContainer.innerHTML += `<span class="badge-veg">🌱 채식주의 맞춤 식단</span>`;
            if (selectedAllergens.size > 0) badgeContainer.innerHTML += `<span class="badge-info">제외된 알레르기: ${Array.from(selectedAllergens).join(', ')}</span>`;

            getRecommendation();
        }

        function getRecommendation() {
            const loading = document.getElementById('loading');
            const list = document.getElementById('recommendation-list');
            loading.style.display = 'block';
            list.style.display = 'none';

            const menuPool = mealDatabase[selectedMealTime];
            let safeMenus = menuPool.filter(menu => {
                if (menu.allergens.some(a => selectedAllergens.has(a))) return false;
                if (isVegetarianMode && !menu.isVegetarian) return false;
                return true;
            });

            let candidateMenus = safeMenus.filter(m => !currentMenuIds.has(m.id));
            if (candidateMenus.length < 3) { candidateMenus = safeMenus; currentMenuIds.clear(); }

            const shuffled = [...candidateMenus].sort(() => 0.5 - Math.random());
            const selectedThree = shuffled.slice(0, 3);

            currentMenuIds.clear();
            selectedThree.forEach(m => currentMenuIds.add(m.id));

            setTimeout(() => {
                renderCards(selectedThree);
                loading.style.display = 'none';
                list.style.display = 'flex';
            }, 350);
        }

        function renderCards(menus) {
            const container = document.getElementById('recommendation-list');
            container.innerHTML = '';
            destroyMap();
            openedCard = null;

            if (menus.length === 0) {
                container.innerHTML = '<p style="color:#64748b; padding:24px;">선택하신 조건(채식/알레르기)을 만족하는 메뉴가 부족합니다. 😢<br>설정을 일부 변경해 주세요.</p>';
                return;
            }

            menus.forEach(menu => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-main">
                        <div class="card-emoji">${menu.emoji}</div>
                        <div class="card-info">
                            <div class="card-header">
                                <span class="card-title">${menu.name}</span>
                                <span class="card-meta">${menu.category} · ${menu.calories}</span>
                            </div>
                            <div class="card-desc">${menu.desc}</div>
                            <div class="card-action">📍 강남구청 주변 식당 보기</div>
                        </div>
                    </div>
                    <div class="card-map-area"></div>
                `;
                card.querySelector('.card-main').addEventListener('click', () => toggleCardMap(card, menu));
                container.appendChild(card);
            });
        }

        /* ===================== 지도 (강남구청 주변, API 키 없음) ===================== */
        function destroyMap() {
            if (currentLeafletMap) { currentLeafletMap.remove(); currentLeafletMap = null; }
        }

        function toggleCardMap(card, menu) {
            if (card.classList.contains('open')) { closeCard(card); openedCard = null; return; }
            if (openedCard) closeCard(openedCard);

            card.classList.add('open');
            card.querySelector('.card-action').innerText = '📍 지도 닫기';
            openedCard = card;
            showRestaurantMap(menu, card.querySelector('.card-map-area'));
        }

        function closeCard(card) {
            destroyMap();
            card.classList.remove('open');
            card.querySelector('.card-action').innerText = '📍 강남구청 주변 식당 보기';
            card.querySelector('.card-map-area').innerHTML = '';
        }

        function isStillOpen(mapArea) {
            const card = mapArea.closest('.card');
            return mapArea.isConnected && card && card.classList.contains('open');
        }

        async function fetchOverpass(cfg, radius) {
            const types = '["amenity"~"restaurant|cafe|fast_food"]';
            let parts = `nwr(around:${radius},${CENTER.lat},${CENTER.lng})${types}["name"~"${cfg.names}"];`;
            if (cfg.cuisine) parts += `nwr(around:${radius},${CENTER.lat},${CENTER.lng})${types}["cuisine"~"${cfg.cuisine}"];`;
            const query = `[out:json][timeout:20];(${parts});out center 40;`;

            let lastErr;
            for (const endpoint of OVERPASS_ENDPOINTS) {
                try {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), 20000);
                    const res = await fetch(endpoint + '?data=' + encodeURIComponent(query), { signal: ctrl.signal });
                    clearTimeout(timer);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    return data.elements || [];
                } catch (e) { lastErr = e; }
            }
            throw lastErr;
        }

        function elementToPlace(el) {
            const lat = el.lat ?? (el.center && el.center.lat);
            const lng = el.lon ?? (el.center && el.center.lon);
            const t = el.tags || {};
            const name = t['name:ko'] || t.name;
            if (lat == null || lng == null || !name) return null;
            const addr = [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(' ');
            return { name, address: addr, lat, lng, dist: distanceMeters(CENTER.lat, CENTER.lng, lat, lng) };
        }

        function distanceMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000, rad = d => d * Math.PI / 180;
            const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        const formatDistance = m => m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(1)}km`;
        const escapeHtml = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const naverSearchUrl = q => `https://map.naver.com/p/search/${encodeURIComponent(q)}`;

        async function showRestaurantMap(menu, mapArea) {
            const cfg = SEARCH_CONFIG[menu.id] || { keyword: menu.name, names: menu.name, cuisine: '' };
            const naverQuery = `${CENTER.name} ${cfg.keyword}`;

            mapArea.innerHTML = `
                <div class="map-status">🔎 ${CENTER.name} 주변 '${escapeHtml(cfg.keyword)}' 식당을 찾는 중...</div>
                <div class="map-canvas"></div>
                <ul class="place-list"></ul>
                <a class="naver-btn" href="${naverSearchUrl(naverQuery)}" target="_blank" rel="noopener">🟢 네이버 지도에서 '${escapeHtml(naverQuery)}' 검색 ↗</a>
                <div class="map-credit">지도 © OpenStreetMap contributors · 식당 정보 OpenStreetMap</div>
            `;
            const status = mapArea.querySelector('.map-status');
            const canvas = mapArea.querySelector('.map-canvas');
            const listEl = mapArea.querySelector('.place-list');

            destroyMap();
            const map = L.map(canvas, { scrollWheelZoom: false }).setView([CENTER.lat, CENTER.lng], 16);
            currentLeafletMap = map;
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

            // 강남구청 표시
            L.circleMarker([CENTER.lat, CENTER.lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 })
                .addTo(map).bindTooltip(CENTER.name, { permanent: true, direction: 'top', offset: [0, -8] });

            try {
                let elements = await fetchOverpass(cfg, 1000);
                if (elements.length === 0) elements = await fetchOverpass(cfg, 2000); // 반경 확대
                if (!isStillOpen(mapArea)) return;

                const seen = new Set();
                const places = elements.map(elementToPlace).filter(Boolean)
                    .sort((a, b) => a.dist - b.dist)
                    .filter(p => { const k = p.name + Math.round(p.lat * 1e4); if (seen.has(k)) return false; seen.add(k); return true; })
                    .slice(0, 8);

                if (places.length === 0) {
                    status.innerText = `😢 ${CENTER.name} 주변에서 '${cfg.keyword}' 식당 정보를 찾지 못했어요. 아래 버튼으로 네이버 지도에서 검색해 보세요.`;
                    return;
                }

                const group = L.featureGroup([L.marker([CENTER.lat, CENTER.lng])]);
                places.forEach((place, i) => {
                    const marker = L.marker([place.lat, place.lng]).addTo(map).bindPopup(`
                        <div class="popup">
                            <strong>${escapeHtml(place.name)}</strong><br>
                            ${place.address ? escapeHtml(place.address) + '<br>' : ''}
                            <a href="${naverSearchUrl(CENTER.name + ' ' + place.name)}" target="_blank" rel="noopener">네이버 지도에서 보기 ↗</a>
                        </div>`);
                    group.addLayer(marker);

                    const li = document.createElement('li');
                    li.className = 'place-item';
                    li.innerHTML = `
                        <div>
                            <div class="place-name">${i + 1}. ${escapeHtml(place.name)}</div>
                            ${place.address ? `<div class="place-sub">${escapeHtml(place.address)}</div>` : ''}
                        </div>
                        <div class="place-dist">${formatDistance(place.dist)}</div>`;
                    li.addEventListener('click', () => { map.setView([place.lat, place.lng], 17); marker.openPopup(); });
                    listEl.appendChild(li);
                });

                map.fitBounds(group.getBounds(), { padding: [30, 30], maxZoom: 17 });
                status.innerText = `✅ ${CENTER.name} 주변 '${cfg.keyword}' 식당 ${places.length}곳 (가까운 순)`;
            } catch (err) {
                console.error(err);
                status.classList.add('error');
                status.innerText = '⚠️ 식당 정보를 불러오지 못했어요. 잠시 후 다시 시도하거나 아래 버튼으로 네이버 지도에서 검색해 보세요.';
            }
        }
    </script>
